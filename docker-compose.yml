# Production-style stack: API + Celery worker + Redis + PostgreSQL.
#   cp .env.example .env   (set POSTGRES_PASSWORD and VOXORA_API_KEY_PEPPER)
#   docker compose up -d --build
#   docker compose run --rm api python -m scripts.create_api_key --email you@example.com
# GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Lightweight single-container dev stack (SQLite, no Redis): docker compose -f docker-compose.local.yml up --build
#
# The API and the worker share the "voxora-data" volume (uploads, generated audio, models).
# A multi-host deployment needs a shared filesystem or a custom StorageBackend (see docs/ARCHITECTURE.md).

x-voxora-env: &voxora-env
  VOXORA_ENVIRONMENT: production
  VOXORA_DATA_DIR: /data
  VOXORA_DATABASE_URL: postgresql+psycopg://voxora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/voxora
  VOXORA_REDIS_URL: redis://redis:6379/0
  VOXORA_JOB_BACKEND: celery
  VOXORA_API_KEY_PEPPER: ${VOXORA_API_KEY_PEPPER:?set VOXORA_API_KEY_PEPPER in .env}
  VOXORA_CORS_ORIGINS: ${VOXORA_CORS_ORIGINS:-}
  VOXORA_WHISPER_MODEL_SIZE: ${VOXORA_WHISPER_MODEL_SIZE:-small}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: voxora
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxora -d voxora"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: voxora-ai-engine
    restart: unless-stopped
    environment:
      <<: *voxora-env
      VOXORA_RUN_MIGRATIONS: "true"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [voxora-data:/data]

  worker:
    image: voxora-ai-engine
    restart: unless-stopped
    environment:
      <<: *voxora-env
      VOXORA_RUN_MIGRATIONS: "false"
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=1 -Q voxora
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    volumes: [voxora-data:/data]

volumes:
  pgdata:
  voxora-data:
