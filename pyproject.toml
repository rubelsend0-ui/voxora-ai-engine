[project]
name = "voxora-ai-engine"
version = "1.0.0"
description = "Self-hosted AI voice platform: cloning, TTS, STT, translation and dubbing behind a REST API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "models: needs real AI models (opt-in via VOXORA_RUN_MODEL_TESTS=1)",
]
